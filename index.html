    <form id="recovery-form" class="auth-card hidden">
      <div class="brand-mark">S</div>
      <p class="eyebrow">RECUPERAR ACCESO</p>
      <h1>¿Olvidaste tu contraseña?</h1>
      <p class="muted">Te enviaremos un enlace para crear una contraseña nueva.</p>

      <label for="recovery-email">Correo electrónico</label>
      <input id="recovery-email" type="email" required
        autocomplete="email" placeholder="nombre@empresa.com">

      <button class="primary-btn" type="submit">Enviar enlace</button>
      <button id="back-to-login" class="secondary-btn" type="button">
        Volver al inicio de sesión
      </button>
      <p id="recovery-message" class="message" role="status"></p>
    </form>

    <form id="reset-form" class="auth-card hidden">
      <div class="brand-mark">S</div>
      <p class="eyebrow">NUEVA CONTRASEÑA</p>
      <h1>Restablecer contraseña</h1>
      <p class="muted">Elegí una contraseña nueva para tu cuenta.</p>

      <label for="new-password">Nueva contraseña</label>
      <input id="new-password" type="password" required minlength="6"
        autocomplete="new-password" placeholder="Mínimo 6 caracteres">

      <label for="confirm-new-password">Confirmar contraseña</label>
      <input id="confirm-new-password" type="password" required minlength="6"
        autocomplete="new-password" placeholder="Repetí la contraseña">

      <button class="primary-btn" type="submit">Guardar contraseña nueva</button>
      <p id="reset-message" class="message" role="status"></p>
    </form>
